name: Build llama-server (Vulkan GDN cache fusion fix)

on:
  push:
    branches: [ gdn-fix ]
  workflow_dispatch:

jobs:
  build-windows-vulkan:
    name: Windows x64 Vulkan
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: true
          cache: true

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Ninja" `
            -DGGML_VULKAN=ON `
            -DGGML_CUDA=OFF `
            -DGGML_HIP=OFF `
            -DGGML_METAL=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DCMAKE_BUILD_TYPE=Release
        shell: pwsh

      - name: Build llama-server
        run: cmake --build build --config Release --target llama-server -j 4
        shell: pwsh

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\llama-server.exe dist\ -Force -ErrorAction SilentlyContinue
          Copy-Item build\bin\llama-server.exe dist\ -Force -ErrorAction SilentlyContinue
          Get-ChildItem build\*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination dist\
          Get-ChildItem build\bin\*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination dist\
          Write-Host "=== dist contents ==="; Get-ChildItem dist\
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-vulkan-gdn-fix-windows-x64
          path: dist\
          retention-days: 30
