name: Build ggml-vulkan.dll GDN fix

on:
  push:
    branches: [ gdn-fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    env:
      LMSTUDIO_COMMIT: 18443257a835af7e7cf25ad11ebc218dcfce8c54
      VULKAN_VERSION: 1.4.357.0

    steps:
      - name: Checkout gdn-fix branch (for patch script)
        uses: actions/checkout@v4
        with:
          path: gdn-fix-repo

      - name: Clone llama.cpp at LM Studio 2.31.2 commit
        shell: pwsh
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git source
          cd source
          git checkout $env:LMSTUDIO_COMMIT
          Write-Host "At:" (git log -1 --oneline)

      - name: Apply GDN cache fusion fix
        shell: pwsh
        run: |
          & "gdn-fix-repo\apply-gdn-fix.ps1" -SourceDir source

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -o $env:RUNNER_TEMP\vk.exe -L "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\vk.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\ProgramData\chocolatey\bin"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cd source
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF `
            -DGGML_VULKAN=ON -DGGML_CUDA=OFF -DGGML_HIP=OFF `
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF

      - name: Build ggml-vulkan
        shell: pwsh
        run: |
          cd source
          cmake --build build --config Release --target ggml-vulkan -j $env:NUMBER_OF_PROCESSORS

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory dist | Out-Null
          $dll = Get-ChildItem source\build -Recurse -Filter ggml-vulkan.dll |
                 Where-Object { $_.FullName -notmatch "CMakeFiles" } | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName dist\
            Write-Host "Size:" ([math]::Round($dll.Length/1MB,2)) "MB"
          } else {
            Get-ChildItem source\build -Recurse -Filter "*.dll" | Select-Object FullName
            exit 1
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ggml-vulkan-gdn-fix-lmstudio-2.31.2
          path: dist\ggml-vulkan.dll
          retention-days: 30
