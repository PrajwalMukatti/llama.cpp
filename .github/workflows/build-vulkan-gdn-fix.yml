name: Build llama-server (Vulkan GDN cache fusion fix)

on:
  push:
    branches: [ gdn-fix ]
  workflow_dispatch:

jobs:
  build-windows-vulkan:
    name: Windows x64 Vulkan
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          $out = "$env:TEMP\vulkan-sdk.exe"
          Write-Host "Downloading Vulkan SDK..."
          Invoke-WebRequest -Uri $url -OutFile $out
          Write-Host "Installing..."
          Start-Process -FilePath $out -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          # Find installed path
          $sdkPath = (Get-ChildItem "C:\VulkanSDK" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          Write-Host "Vulkan SDK installed at: $sdkPath"
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DGGML_VULKAN=ON `
            -DGGML_CUDA=OFF `
            -DGGML_HIP=OFF `
            -DGGML_METAL=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DCMAKE_BUILD_TYPE=Release
        shell: pwsh

      - name: Build llama-server
        run: |
          cmake --build build --config Release --target llama-server -j 4
        shell: pwsh

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\llama-server.exe dist\ -Force
          Get-ChildItem build\Release\*.dll | Copy-Item -Destination dist\
          Write-Host "Contents of dist:"
          Get-ChildItem dist\
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-vulkan-gdn-fix-windows-x64
          path: dist\
          retention-days: 30
