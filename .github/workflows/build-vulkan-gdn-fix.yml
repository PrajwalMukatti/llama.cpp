name: Build llama-server (Vulkan GDN cache fusion fix)

on:
  push:
    branches: [ gdn-fix ]
  workflow_dispatch:

jobs:
  build-windows-vulkan:
    name: Windows x64 Vulkan
    runs-on: windows-2025

    env:
      VULKAN_VERSION: 1.4.357.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"
        shell: pwsh

      - name: Install Ninja
        run: |
          choco install ninja -y --no-progress
          $ninjaPath = (Get-Command ninja -ErrorAction SilentlyContinue)?.Source
          if (-not $ninjaPath) {
            # choco installs to C:\ProgramData\chocolatey\bin
            Add-Content $env:GITHUB_PATH "C:\ProgramData\chocolatey\bin"
          }
          Write-Host "Ninja: $(ninja --version)"
        shell: pwsh

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_NATIVE=OFF `
            -DGGML_VULKAN=ON `
            -DGGML_CUDA=OFF `
            -DGGML_HIP=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TESTS=OFF
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --target llama-server -j $env:NUMBER_OF_PROCESSORS
        shell: pwsh

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path build -Recurse -Filter "llama-server.exe" |
            Where-Object { $_.FullName -notmatch "CMakeFiles" } |
            Select-Object -First 1 | Copy-Item -Destination dist\ -Force
          Get-ChildItem -Path build -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "CMakeFiles" } |
            Copy-Item -Destination dist\ -Force -ErrorAction SilentlyContinue
          Write-Host "=== dist ===" ; Get-ChildItem dist\
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-vulkan-gdn-fix-windows-x64
          path: dist\
          retention-days: 30
