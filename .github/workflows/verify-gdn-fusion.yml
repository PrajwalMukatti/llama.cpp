name: Verify GDN fusion (correctness at master)

on:
  push:
    branches: [ gdn-fix ]
  workflow_dispatch:

# Builds llama.cpp at CURRENT master with our GDN cache-fusion patch, then proves correctness:
#   1. test-backend-ops for GATED_DELTA_NET on the CPU backend (always available) — sanity that
#      the op itself is untouched.
#   2. A/B on the Vulkan software rasterizer (llvmpipe/lavapipe): run test-backend-ops for
#      GATED_DELTA_NET with fusion ON vs GGML_VK_DISABLE_FUSION=1. Both must pass (the harness
#      compares backend output to the CPU reference internally), which proves the fused path
#      produces the same result as the reference within tolerance.
#
# Note: llvmpipe exercises the Vulkan code path in software on the CI runner (no GPU needed).
# The real-GPU A/B on gfx1150 is done locally and pasted into the PR.

jobs:
  verify-linux-vulkan-llvmpipe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch scripts
        uses: actions/checkout@v4
        with:
          path: gdn-fix-repo

      - name: Clone llama.cpp at master
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git source
          cd source && echo "master:" $(git rev-parse --short HEAD)

      - name: Install deps (Vulkan SDK + lavapipe software rasterizer)
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake ninja-build glslc libvulkan-dev vulkan-tools \
            mesa-vulkan-drivers libvulkan1 spirv-tools
          # confirm a software Vulkan device is visible
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json vulkaninfo --summary 2>/dev/null | head -30 || true

      - name: Apply GDN fusion patch (bash port of the PS patch)
        run: |
          bash gdn-fix-repo/apply-gdn-fix.sh source

      - name: Configure + build test-backend-ops
        run: |
          cd source
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DLLAMA_BUILD_TESTS=ON
          cmake --build build --target test-backend-ops -j $(nproc)

      - name: test-backend-ops — CPU reference (GATED_DELTA_NET)
        run: |
          cd source
          ./build/bin/test-backend-ops -o GATED_DELTA_NET 2>&1 | tee cpu.log || true
          grep -iE "GATED_DELTA_NET|OK|FAIL|passed" cpu.log | tail -20

      - name: A/B — Vulkan fused vs non-fused (llvmpipe)
        run: |
          cd source
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          echo "=== FUSION ON ==="
          ./build/bin/test-backend-ops -b Vulkan0 -o GATED_DELTA_NET 2>&1 | tee vk_on.log || true
          echo "=== FUSION OFF (GGML_VK_DISABLE_FUSION=1) ==="
          GGML_VK_DISABLE_FUSION=1 ./build/bin/test-backend-ops -b Vulkan0 -o GATED_DELTA_NET 2>&1 | tee vk_off.log || true
          echo "=== both must report the same pass/fail for every GATED_DELTA_NET case ==="
          grep -iE "GATED_DELTA_NET.*(OK|FAIL|not supported)" vk_on.log  | sort > on.txt  || true
          grep -iE "GATED_DELTA_NET.*(OK|FAIL|not supported)" vk_off.log | sort > off.txt || true
          if diff -u off.txt on.txt; then echo "A/B MATCH: fused path == reference path"; else echo "A/B DIFF — investigate before submitting"; fi
